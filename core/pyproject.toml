[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencompass-core"
version = "0.2.0"
description = "Python Core service for Eval Dominator."
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.62",
    "grpcio-tools>=1.62",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
